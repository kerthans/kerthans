name: Sync profile README

on:
  push:
    branches:
      - main
    paths:
      - profile.yml
      - scripts/render-profile.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Render profile
        run: npm run profile:render

      - name: Check whitespace
        run: git diff --check

      - name: Audit profile
        run: npm run profile:audit

      - name: Commit synced README
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): sync README"
          git push
