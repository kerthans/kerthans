name: Maintain profile README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - profile.yml
      - scripts/**
      - .github/workflows/**
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - README.md
      - profile.yml
      - scripts/**
      - .github/workflows/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Render profile
        if: github.event_name != 'pull_request'
        run: npm run profile:render

      - name: Check generated README
        run: npm run profile:check

      - name: Audit profile
        run: npm run profile:audit

      - name: Check whitespace
        run: git diff --check

      - name: Commit synced README
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): sync README"
          git push
