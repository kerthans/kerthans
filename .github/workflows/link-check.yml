name: Link check

on:
  push:
    branches: [main]
    paths:
      - README.md
      - profile.yml
      - scripts/check-links.mjs
      - .github/workflows/link-check.yml
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check README links
        run: npm run profile:links
